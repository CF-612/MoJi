name: Check source and installation files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:build
      - name: Audit installable package
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/cuigengji-pack.json"
          node scripts/audit-release.mjs "$RUNNER_TEMP/cuigengji-pack.json"
