<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说工作台 · 侧栏协作演示</title>
<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#252d2b;--line:#deded6;--accent:#38665b;--paper:#fff;--muted:#777e75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:650;letter-spacing:1px}small,.muted{color:var(--muted)}h1{font-size:19px;margin:28px 0 10px}.tabs{display:flex;border-bottom:1px solid var(--line);gap:8px;margin-top:22px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--fg);border-radius:8px;padding:9px 14px}button:disabled{opacity:.5;cursor:default}.tabs button{border:0;background:transparent;border-radius:0}.tabs button[aria-selected=true]{border-bottom:2px solid var(--accent);color:var(--accent)}textarea{width:100%;min-height:55vh;resize:vertical;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;color:var(--fg);font:17px/2 "Microsoft YaHei",sans-serif}textarea:focus{outline:2px solid var(--accent);outline-offset:2px}.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}#status{font-size:13px}.error{color:#b34b33}#history li{list-style:none;padding:14px 0;border-bottom:1px solid var(--line)}#history ul{padding:0}#history pre{white-space:pre-wrap;line-height:1.8;font-family:inherit}.badge{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:4px 7px}.notice{font-size:13px;color:var(--muted);line-height:1.8} [hidden]{display:none!important}@media(max-width:480px){main{padding:16px}textarea{padding:16px;font-size:16px}header{align-items:flex-start}.brand{font-size:19px}}@media(prefers-color-scheme:dark){:root{--bg:#202624;--fg:#e6e8e1;--line:#414a44;--accent:#528777;--paper:#29312d;--muted:#b1b8ae}}
</style></head><body><main>
<header><div><div class="brand">小说工作台</div><small id="book">载入作品…</small></div><span class="badge">演示作品</span></header>
<nav class="tabs" aria-label="工作台标签"><button id="proseTab" aria-selected="true">正文</button><button id="historyTab" aria-selected="false">版本历史</button></nav>
<section id="prose"><h1 id="title">正在读取章节</h1><div class="bar"><span id="revision" class="muted"></span><span id="status" role="status">连接中</span></div><textarea id="content" aria-label="章节正文" disabled></textarea><div class="bar"><button class="primary" id="save" disabled>保存正文</button><button id="refresh">读取最新版本</button><button id="discuss">围绕选中内容讨论</button></div><p class="notice">你和 AI 修改同一份演示正文。AI 保存后自动更新；有未保存文字时保留草稿并提示版本变化。真实小说尚未导入。</p></section>
<section id="history" hidden><h1>可恢复的历史版本</h1><ul id="versions"></ul></section>
<section id="draftBackup" hidden><h1 id="backupLabel">保留的草稿</h1><p class="notice">读取新版或恢复历史时，未保存文字保留在这里。请对照正文合并修改。</p><textarea id="backupContent" aria-label="保留的草稿" readonly></textarea><div class="bar"><button id="reuseDraft">将保留草稿放回编辑框</button></div></section>
</main><!-- SCRIPT --></body></html>
